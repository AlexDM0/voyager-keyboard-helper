<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>The same-hand Shift guard</title>
  <desc>Decision ladder for a key settling while Shift is already held: a hold builds a modifier stack, an opposite-hand key capitalises, and only a same-hand letter typed outside a chord is forced lowercase.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#73726c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="528" rx="16" fill="#FAF9F5" stroke="#ECE7DC" stroke-width="1.5"/>

  <text x="40" y="46" font-size="18" font-weight="500" fill="#3d3d3a">A capital always comes from the other hand</text>
  <text x="40" y="68" font-size="13" fill="#73726c">what happens to the next key once Shift has already settled as a hold</text>

  <!-- spine connectors -->
  <path d="M175,144 L175,174" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M175,232 L175,270" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M175,328 L175,366" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M175,424 L175,454" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="184" y="256" font-size="11" fill="#73726c">tap</text>
  <text x="184" y="352" font-size="11" fill="#73726c">same hand</text>
  <text x="184" y="445" font-size="11" fill="#73726c">just typing</text>

  <!-- right connectors -->
  <path d="M280,202 L408,202" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M280,300 L408,300" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M280,396 L408,396" fill="none" stroke="#bfbdb0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="344" y="196" font-size="11" fill="#73726c" text-anchor="middle">hold</text>
  <text x="344" y="294" font-size="11" fill="#73726c" text-anchor="middle">other hand</text>
  <text x="344" y="390" font-size="11" fill="#73726c" text-anchor="middle">not typing a letter</text>

  <!-- spine boxes -->
  <rect x="70" y="88" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#E1DDD0"/>
  <text x="175" y="112" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Next key settles</text>
  <text x="175" y="130" font-size="12" fill="#5F5E5A" text-anchor="middle">Shift is already at the OS</text>

  <rect x="70" y="176" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="175" y="200" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Tap or hold?</text>
  <text x="175" y="218" font-size="12" fill="#185FA5" text-anchor="middle">the decision, not the press</text>

  <rect x="70" y="272" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="175" y="296" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Which hand?</text>
  <text x="175" y="314" font-size="12" fill="#185FA5" text-anchor="middle">thumbs count as neither</text>

  <rect x="70" y="368" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#CFE2F6"/>
  <text x="175" y="392" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">A letter being typed?</text>
  <text x="175" y="410" font-size="12" fill="#185FA5" text-anchor="middle">A–Z, no Cmd/Ctrl/Alt held</text>

  <rect x="70" y="456" width="210" height="52" rx="8" fill="#EAF3DE" stroke="#D3E6BC"/>
  <text x="175" y="479" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Lowercase letter</text>
  <text x="175" y="497" font-size="12" fill="#3B6D11" text-anchor="middle">Shift handed back after</text>

  <!-- outcome boxes -->
  <rect x="410" y="176" width="210" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="515" y="199" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Modifier or layer</text>
  <text x="515" y="217" font-size="12" fill="#854F0B" text-anchor="middle">Shift joins the stack</text>

  <rect x="410" y="274" width="210" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="515" y="297" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Capital</text>
  <text x="515" y="315" font-size="12" fill="#854F0B" text-anchor="middle">what Shift is for</text>

  <rect x="410" y="370" width="210" height="52" rx="8" fill="#FAEEDA" stroke="#F2DDB0"/>
  <text x="515" y="393" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">Shift still applies</text>
  <text x="515" y="411" font-size="12" fill="#854F0B" text-anchor="middle">Cmd+Shift+A, symbols</text>
</svg>
